version: '3.8'

services:
  # PostgreSQL — основная БД
  postgres:
    image: postgres:15
    container_name: bankapp-postgres
    environment:
      POSTGRES_DB: bankapp
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis — кэш (аналог Hazelcast)
  redis:
    image: redis:7-alpine
    container_name: bankapp-redis
    ports:
      - "6379:6379"

  # Zookeeper нужен для Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: bankapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # Apache Kafka — брокер сообщений
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bankapp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Kafka UI — веб-интерфейс для Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bankapp-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # WireMock — мок-сервис (аналог заглушек)
  wiremock:
    image: wiremock/wiremock:latest
    container_name: bankapp-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock

  # Jenkins — CI/CD
  jenkins:
    image: jenkins/jenkins:lts
    container_name: bankapp-jenkins
    ports:
      - "8888:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home

volumes:
  postgres_data:
  jenkins_data:
